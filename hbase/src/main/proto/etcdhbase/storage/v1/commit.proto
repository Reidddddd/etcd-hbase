syntax = "proto3";
package etcdhbase.storage.v1;
option java_package = "io.etcdhbase.hbase.storage.proto";
option java_outer_classname = "CommitProtos";

// Internal HBase commit/MVCC records. This schema is separate from the upstream etcd wire API.
message CommitControlState {
  optional uint32 format_version = 1;
  optional bytes profile_fingerprint = 2;
  optional string owner_instance = 3;
  optional int64 owner_epoch = 4;
  optional int64 owner_lease_deadline_epoch_millis = 5;
  optional int64 state_version = 6;
  optional int64 published_sequence = 7;
  optional int64 published_revision = 8;
  optional int64 finalized_sequence = 9;
  optional int64 finalized_revision = 10;
  optional int64 compact_revision = 11;
  optional PublicationSlot publication = 12;
}

message PublicationSlot {
  optional bytes transaction_id = 1;
  optional bytes invocation_id = 2;
  optional int64 owner_epoch = 3;
  optional int64 base_sequence = 4;
  optional int64 base_revision = 5;
  optional int64 sequence = 6;
  optional int64 revision = 7;
  optional bool contains_key_changes = 8;
  optional bytes manifest_root = 9;
  optional bytes manifest_digest = 10;
}

enum InvocationAttemptState {
  INVOCATION_STATE_UNSPECIFIED = 0;
  INVOCATION_PREPARING = 1;
  INVOCATION_SEALED = 2;
  INVOCATION_SELECTED = 3;
  INVOCATION_NOT_SELECTED = 4;
  INVOCATION_WINDOW_CLOSED = 5;
  INVOCATION_NO_CHANGES = 6;
}

message InvocationBinding {
  optional uint32 format_version = 1;
  optional bytes invocation_id = 2;
  optional bytes request_digest = 3;
  optional bytes authorization_scope_digest = 4;
  optional bytes transaction_id = 5;
  optional int64 prepared_owner_epoch = 6;
  optional int64 base_sequence = 7;
  optional int64 base_revision = 8;
  optional InvocationAttemptState state = 9;
  optional bytes manifest_root = 10;
  optional bytes result_reference = 11;
}

// Durable response records bind output to one request, authorization scope and attempt.
// These are internal storage records, not the public etcd protobuf messages.
message ResultIdentity {
  optional bytes invocation_id = 1;
  optional bytes transaction_id = 2;
  optional bytes request_digest = 3;
  optional bytes authorization_scope_digest = 4;
  optional int64 owner_epoch = 5;
  optional int64 base_sequence = 6;
  optional int64 base_revision = 7;
}

message ResultPage {
  optional uint32 format_version = 1;
  optional ResultIdentity identity = 2;
  optional uint32 page_index = 3;
  optional bytes payload = 4;
  optional bytes digest = 5;
  optional uint32 item_count = 6;
}

message ResultPageReference {
  optional uint32 page_index = 1;
  optional uint32 payload_bytes = 2;
  optional bytes digest = 3;
  optional uint32 item_count = 4;
}

message ResultDirectory {
  optional uint32 format_version = 1;
  optional ResultIdentity identity = 2;
  repeated ResultPageReference pages = 3;
  optional bytes digest = 4;
  optional uint32 item_count = 5;
}

message ResultReference {
  optional ResultIdentity identity = 1;
  optional bytes digest = 2;
  optional uint32 page_count = 3;
  optional uint64 total_bytes = 4;
  optional uint32 item_count = 5;
}

message ResultKeyValue {
  optional bytes key = 1;
  optional int64 create_revision = 2;
  optional int64 modification_revision = 3;
  optional int64 version = 4;
  optional int64 lease_id = 5;
  optional bytes value = 6;
  optional uint32 value_length = 7;
}

// ResultNode describes a logical response position, not an etcd wire response.
message ResultHeader {
  optional bool present = 1;
  optional int64 revision = 2;
}

message PutResultNode {
  optional bytes key = 1;
  optional ResultKeyValue previous = 2;
}

message DeleteResultNode {
  optional int64 deleted = 1;
  repeated ResultKeyValue previous = 2;
}

message RangeResultNode {
  repeated ResultKeyValue records = 1;
  optional int64 count = 2;
  optional bool more = 3;
}

message TxnResultNode {
  optional bool succeeded = 1;
  repeated ResultNode responses = 2;
}

message ResultNode {
  optional uint32 ordinal = 1;
  optional ResultHeader header = 2;
  oneof kind {
    PutResultNode put = 3;
    DeleteResultNode delete = 4;
    RangeResultNode range = 5;
    TxnResultNode txn = 6;
  }
}

message ResultTree {
  optional uint32 format_version = 1;
  optional ResultNode root = 2;
  optional uint32 node_count = 3;
  optional uint32 record_count = 4;
  optional uint64 retained_bytes = 5;
}

message PreparedCandidate {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional int64 owner_epoch = 3;
  optional int64 base_sequence = 4;
  optional int64 base_revision = 5;
  optional bytes logical_key = 6;
  optional int64 create_revision = 7;
  optional int64 version = 8;
  optional int64 lease_id = 9;
  optional bool tombstone = 10;
  optional bytes value = 11;
  optional bytes content_digest = 12;
}

message CandidateReference {
  optional bytes logical_key = 1;
  optional bytes candidate_identity = 2;
  optional bytes candidate_digest = 3;
  optional bytes value_digest = 4;
  optional uint32 value_length = 5;
  optional bool tombstone = 6;
  optional uint32 bucket = 7;
}

message ManifestPage {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional uint32 page_index = 3;
  repeated CandidateReference candidates = 4;
  optional bytes page_digest = 5;
}

message ManifestPageReference {
  optional bytes page_identity = 1;
  optional bytes page_digest = 2;
  optional bytes first_key = 3;
  optional bytes last_key = 4;
  optional uint64 item_count = 5;
  optional uint32 page_count = 6;
  optional uint64 value_bytes = 7;
  optional uint32 level = 8;
  optional uint32 first_bucket = 9;
  optional uint32 last_bucket = 10;
}

message ManifestDirectoryPage {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional uint32 level = 3;
  repeated ManifestPageReference children = 4;
  optional bytes page_digest = 5;
  optional uint32 page_index = 6;
}

message ManifestRoot {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional int64 owner_epoch = 3;
  optional int64 base_sequence = 4;
  optional int64 base_revision = 5;
  optional uint64 candidate_count = 6;
  optional uint64 total_value_bytes = 7;
  optional bytes directory_identity = 8;
  optional bytes directory_digest = 9;
  optional bytes root_digest = 10;
  optional bytes directory_first_key = 11;
  optional bytes directory_last_key = 12;
  optional uint64 directory_item_count = 13;
  optional uint32 directory_page_count = 14;
  optional uint32 directory_level = 15;
  optional uint64 directory_value_bytes = 16;
  optional uint64 event_count = 17;
  optional uint64 total_event_bytes = 18;
  optional bytes event_directory_identity = 19;
  optional bytes event_directory_digest = 20;
  optional uint64 event_directory_first_ordinal = 21;
  optional uint64 event_directory_last_ordinal = 22;
  optional uint64 event_directory_item_count = 23;
  optional uint32 event_directory_page_count = 24;
  optional uint32 event_directory_level = 25;
  optional uint64 event_directory_total_bytes = 26;
  optional uint32 directory_first_bucket = 27;
  optional uint32 directory_last_bucket = 28;
  optional ResultReference result = 29;
  optional AuxiliaryReference auxiliary = 30;
}

enum PreparedEventKind {
  PREPARED_EVENT_UNSPECIFIED = 0;
  PREPARED_EVENT_PUT = 1;
  PREPARED_EVENT_DELETE = 2;
}

message EventRecord {
  optional bytes logical_key = 1;
  optional int64 create_revision = 2;
  optional int64 modification_revision = 3;
  optional int64 version = 4;
  optional int64 lease_id = 5;
  optional bool tombstone = 6;
  optional uint32 value_length = 7;
  optional bytes value = 8;
}

message PreparedEvent {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional int64 owner_epoch = 3;
  optional int64 base_sequence = 4;
  optional int64 base_revision = 5;
  optional uint64 ordinal = 6;
  optional PreparedEventKind kind = 7;
  optional EventRecord current = 8;
  optional EventRecord previous = 9;
  optional bytes event_digest = 10;
}

message PreparedEventReference {
  optional uint64 ordinal = 1;
  optional bytes identity = 2;
  optional bytes digest = 3;
  optional uint32 encoded_bytes = 4;
}

message EventPageReference {
  optional bytes identity = 1;
  optional bytes digest = 2;
  optional uint64 first_ordinal = 3;
  optional uint64 last_ordinal = 4;
  optional uint64 item_count = 5;
  optional uint64 total_bytes = 6;
  optional uint32 leaf_page_count = 7;
  optional uint32 level = 8;
}

message EventPage {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional uint32 page_index = 3;
  repeated PreparedEventReference events = 4;
  optional bytes page_digest = 5;
}

message EventDirectoryPage {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional uint32 page_index = 3;
  optional uint32 level = 4;
  repeated EventPageReference children = 5;
  optional bytes page_digest = 6;
}

// Lease and Watch metadata is sealed by the same M2 publication decision as KV records.
enum LeaseStatus {
  LEASE_STATUS_UNSPECIFIED = 0;
  LEASE_ACTIVE = 1;
  LEASE_REVOKED = 2;
}

message LeaseState {
  optional uint32 format_version = 1;
  optional int64 lease_id = 2;
  optional int64 incarnation = 3;
  optional int64 granted_ttl_seconds = 4;
  optional int64 deadline_epoch_millis = 5;
  optional int64 renewal_generation = 6;
  optional LeaseStatus status = 7;
  optional int64 sequence = 8;
  optional int64 bound_key_count = 9;
  optional int64 bound_key_bytes = 10;
  optional int64 revoke_cost_bytes = 11;
  optional int64 expiry_candidate_sequence = 12;
  optional int64 binding_history_bytes = 13;
}

// Stored in the existing invocation-bound result pages, not on the public etcd wire.
message LeaseGrantResult {
  optional uint32 format_version = 1;
  optional int64 lease_id = 2;
  optional int64 granted_ttl_seconds = 3;
  optional int64 revision = 4;
}

message LeaseBindingPayload {
  optional uint32 format_version = 1;
  optional int64 lease_id = 2;
  optional int64 incarnation = 3;
  optional bytes key = 4;
  optional bool bound = 5;
  optional int64 sequence = 6;
  optional int64 key_create_revision = 7;
  optional int64 key_mod_revision = 8;
}

message PreparedAuxiliaryRecord {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional int64 owner_epoch = 3;
  optional int64 base_sequence = 4;
  optional uint64 ordinal = 5;
  optional uint32 target_record_type = 6;
  optional bytes target_identity = 7;
  optional bytes payload = 8;
  optional bytes digest = 9;
}

message AuxiliaryRecordReference {
  optional uint64 ordinal = 1;
  optional bytes identity = 2;
  optional bytes digest = 3;
  optional uint32 encoded_bytes = 4;
}

message AuxiliaryPage {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional uint32 page_index = 3;
  repeated AuxiliaryRecordReference records = 4;
  optional bytes page_digest = 5;
}

message AuxiliaryPageReference {
  optional uint32 page_index = 1;
  optional bytes identity = 2;
  optional bytes digest = 3;
  optional uint64 first_ordinal = 4;
  optional uint64 last_ordinal = 5;
  optional uint64 item_count = 6;
  optional uint64 payload_bytes = 7;
}

message AuxiliaryDirectory {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  repeated AuxiliaryPageReference pages = 3;
  optional bytes directory_digest = 4;
  optional uint64 item_count = 5;
  optional uint64 total_bytes = 6;
}

message AuxiliaryReference {
  optional bytes identity = 1;
  optional bytes digest = 2;
  optional uint64 item_count = 3;
  optional uint64 total_bytes = 4;
  optional uint32 page_count = 5;
}

message CommitDecision {
  optional uint32 format_version = 1;
  optional bytes transaction_id = 2;
  optional bytes invocation_id = 3;
  optional int64 sequence = 4;
  optional int64 revision = 5;
  optional bytes manifest_root = 6;
  optional bytes manifest_digest = 7;
  optional bool contains_key_changes = 8;
  optional int64 base_revision = 9;
}

message RowFence {
  optional uint32 format_version = 1;
  optional uint32 row_kind = 2;
  optional uint32 state = 3;
  optional int64 applied_sequence = 4;
  optional bytes transaction_id = 5;
  optional int64 revision = 6;
  optional bytes content_digest = 7;
  optional int64 maintenance_generation = 8;
  optional int64 owner_epoch = 9;
  optional int64 base_sequence = 10;
}
