log4j.rootLogger=WARN, stderr
log4j.logger.io.etcdhbase.server.observability.RequestMetrics=WARN, stderr
log4j.additivity.io.etcdhbase.server.observability.RequestMetrics=false

log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=org.apache.log4j.PatternLayout
log4j.appender.stderr.layout.ConversionPattern=%d{ISO8601} level=%p event=%m%n
